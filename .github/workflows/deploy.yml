# Har push'da Vercel production deploy.
# Vercel'ning GitHub integratsiyasi o'rniga ishlaydi (Login Connection talab qilmaydi).
# Talab: VERCEL_TOKEN secret'i **hasanov jamoasi scope'ida** yaratilgan bo'lishi shart.
name: Deploy to Vercel

on:
  push:
    branches: [main]

concurrency:
  group: vercel-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Tekshiruv darvozasi: typecheck yiqilsa deploy boshlanmaydi.
      # Lint hozircha darvoza emas (54 ta eski xato bor) — tozalangach qo'shiladi.
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit

      - name: Deploy (production)
        env:
          VERCEL_ORG_ID: team_DAgMINGi469pXW8vdEN6Up0i
          VERCEL_PROJECT_ID: prj_GrJgj7nKx3Twt1Z0BW2jXj08dC4B
        run: npx vercel@59 deploy --prod --yes --token ${{ secrets.VERCEL_TOKEN }}

      - name: Health check (Vercel)
        run: |
          for i in $(seq 1 6); do
            sleep 10
            body="$(curl -sS --max-time 20 https://ai-finance-tutor.vercel.app/ || true)"
            if echo "$body" | grep -q "<title>"; then echo ok; exit 0; fi
          done
          echo "health check failed:"; echo "$body"; exit 1
